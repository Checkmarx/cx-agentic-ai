# cx-devassist — admin onboarding configuration
# =============================================================================
# OPTIONAL. Lets an administrator pre-seed the Checkmarx One connection details
# so developers do not have to type them during browser (OAuth) sign-in. When a
# value below is set AND valid, the plugin embeds it directly into the guided
# `cx auth login` command, and the setup skill skips the URL/tenant question.
#
# TWO COPIES OF THIS FILE:
#   1. The BUNDLED copy (this file, inside the plugin). The URL / tenant pre-fill
#      (cx_base_auth_uri, cx_tenant) is read ONLY from here. Edit it in your FORKED /
#      internal copy of the plugin (the versioned, reviewed marketplace artifact) —
#      NOT in an end-user's live install directory, which is overwritten on every
#      plugin update. Keeping those values inside the reviewed bundle is the
#      security boundary; there is no out-of-tree override for them.
#   2. The USER copy at ~/.checkmarx/cx-onboarding.properties (Windows:
#      %USERPROFILE%\.checkmarx\cx-onboarding.properties). The plugin copies the
#      bundled file there the first time a hook runs after install, and NEVER
#      overwrites it afterwards, so a developer's edits survive plugin updates.
#      The scanner switches below (cx_*_scanner_enabled) are read from the USER
#      copy (falling back to the bundled copy if it is missing). To get new defaults
#      after a plugin update, delete the user copy and it is re-seeded.
#
# FORMAT: shell-style `key=value`, one per line. Lines starting with `#` and
# blank lines are ignored. Only the keys below are read; anything else is
# dropped. Values are STRICTLY validated (see each key) — an invalid value is
# ignored (URL/tenant: the plugin asks the developer; scanner switches: the
# scanner stays ENABLED), and nothing here ever makes a hook block.
#
# WHERE TO FIND THESE VALUES:
#   - Checkmarx One environment / regional base URLs (US, EU, ANZ, India, etc.)
#     and how to find your tenant:
#       https://docs.checkmarx.com/en/34965-68530-logging-in-to-checkmarx-one.html
#     Common regions: US https://ast.checkmarx.net · US2 https://us.ast.checkmarx.net
#     EU https://eu.ast.checkmarx.net · ANZ https://anz.ast.checkmarx.net · India https://ind.ast.checkmarx.net
#   - Your tenant (account) name: Checkmarx One → Settings → Identity and Access
#     Management → General Settings (shown as "Display Name"), or the "Account
#     name (Tenant name)" line in your Checkmarx One Welcome email.
# =============================================================================

# cx_base_auth_uri — your region's Checkmarx One URL (scheme + host, https only,
# no path). Passed as `--base-auth-uri`. cx follows the app host's /auth redirect
# to IAM automatically, so you do NOT need the iam.* host here.
# Validation: ^https://<host>[:port]$  (no path, query, spaces, or userinfo)
# Example:
# cx_base_auth_uri=https://eu.ast.checkmarx.net

# cx_tenant — your Checkmarx One tenant (organization) name. Passed as `--tenant`.
# Validation: starts alphanumeric, then letters/digits/._- only, max 64 chars.
# Example:
# cx_tenant=your-tenant

# =============================================================================
# SCANNER SWITCHES (read from the USER copy in ~/.checkmarx)
# =============================================================================
# Every scanner is ENABLED by default. Set a switch to false to turn that scanner
# off. Accepted: true/false (also yes/no, on/off, 1/0; case-insensitive). Anything
# else is treated as true — a typo can never silently disable scanning.
#
# What a disabled scanner means:
#   - its cx-devassist-* skill (asca / sca / kics / secrets) is skipped: the agent
#     does not scan or report that class of finding.
#   - if ALL FOUR are disabled, the plugin's hooks stand down completely: the
#     readiness gate (cx installed / current / authenticated) and the native
#     pre-write scan no longer run, so nothing is blocked.
#   - a disabled scanner never makes a hook deny anything.
# Note: a cx CLI build that reads this file (ast-cli agenthooks/scannerconfig) skips each
# disabled engine in the native pre-write scan too. Older cx builds ignore the
# switches and always scan every engine; the plugin bypasses them only when all
# four are false.

# ASCA — SAST on source code (.py/.js/.java/.go/.ts/.cs …)
cx_asca_scanner_enabled=true

# SCA — open-source dependency manifests (package.json, requirements.txt, go.mod …)
cx_sca_scanner_enabled=true

# KICS — Infrastructure-as-Code (Terraform, Dockerfile, YAML/JSON configs …)
cx_kics_scanner_enabled=true

# Secrets — hardcoded credentials, tokens, keys
cx_secret_scanner_enabled=true

# cx_severity_threshold — minimum severity the skills report and remediate.
# One of: low | medium | high | critical  (default: low = report everything).
# Advisory for the skills only; hooks never use it and it never blocks.
cx_severity_threshold=low
