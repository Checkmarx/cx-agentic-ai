name: Publish Checkmarx MCP Server

on:
  workflow_dispatch:
    inputs:
      mcp-domain:
        description: "Registered domain for DNS authentication (must match the DNS TXT record)"
        required: false
        type: string
        default: "checkmarx.com"
      mcp-publisher-version:
        description: "mcp-publisher release tag to download (pin to a specific version)"
        required: false
        type: string
        default: "v1.8.0"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish MCP Server
    runs-on: cx-public-ubuntu-x64
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download mcp-publisher
        env:
          PUBLISHER_VERSION: ${{ inputs.mcp-publisher-version }}
        run: |
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          curl -fsSL \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_${OS}_${ARCH}.tar.gz" \
            | tar xz mcp-publisher
          chmod +x ./mcp-publisher

      - name: Authenticate (DNS) and publish
        env:
          MCP_DOMAIN: ${{ inputs.mcp-domain }}
          PEM_CONTENT: ${{ secrets.MCP_TOKEN }}
        run: |
          if [ -z "${PEM_CONTENT}" ]; then
            echo "::error::MCP_TOKEN secret is empty or not set"
            exit 1
          fi

          # openssl's STORE-based loader needs a seekable input to auto-detect
          # the key format, so write to a temp file rather than piping via stdin.
          KEY_FILE=$(mktemp)
          trap 'rm -f "${KEY_FILE}"' EXIT
          printf '%s\n' "${PEM_CONTENT}" > "${KEY_FILE}"

          # Extract Ed25519 private key bytes as hex — format required by mcp-publisher dns login
          PRIVATE_KEY_HEX=$(openssl pkey -in "${KEY_FILE}" -noout -text \
            | grep -A3 "priv:" | tail -n +2 | tr -d ' :\n')
          echo "::add-mask::${PRIVATE_KEY_HEX}"

          if [ -z "${PRIVATE_KEY_HEX}" ]; then
            echo "::error::Failed to extract private key hex from MCP_TOKEN"
            exit 1
          fi

          ./mcp-publisher login dns \
            --domain "${MCP_DOMAIN}" \
            --private-key "${PRIVATE_KEY_HEX}"

          ./mcp-publisher publish

      - name: Verify publication
        run: |
          NAME=$(jq -r '.name' server.json)
          echo "Verifying publication of ${NAME}..."
          curl -fsSL "https://registry.modelcontextprotocol.io/v0/servers?search=${NAME}" | jq .
