name: cx-security-tests

# Runs the cx-security plugin's test suite (Python gate + logging, shell bootstrap/resolver/probe,
# and packaging/version-sync invariants) on Ubuntu, macOS, and Windows. The version-sync job
# additionally fails a release tag whose version disagrees with plugin.json.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.gitattributes'
      - 'plugins/cx-security/**'
      - 'tests/**'
      - '.github/workflows/cx-security-tests.yaml'
    tags:
      - 'cx-security-v*'
  pull_request:
    branches: [master]
    paths:
      - '.gitattributes'
      - 'plugins/cx-security/**'
      - 'tests/**'
      - '.github/workflows/cx-security-tests.yaml'

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [cx-private-ubuntu-x64, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Install coverage.py
        shell: bash
        run: python -m pip install --upgrade coverage

      # Files the bootstrap hard-sources / the gate imports MUST be tracked, or a fresh
      # marketplace (git) clone ships a plugin whose self-install dies. Fail if any is missing.
      - name: Guard — load-bearing files are tracked
        shell: bash
        run: |
          git ls-files --error-unmatch \
            plugins/cx-security/scripts/cx-asset-resolver.sh \
            plugins/cx-security/scripts/cx-path-probe.sh \
            plugins/cx-security/hooks/cx_log.py \
            plugins/cx-security/.mcp.json

      # `shell: bash` uses Git Bash on the Windows runner — the same interpreter the gate's
      # hooks resolve via `sh`, so the suite exercises the real cross-OS path.
      - name: Run cx-security test suite
        shell: bash
        run: bash tests/run-tests.sh

      # Real install targets contain spaces (Windows "OneDrive - Checkmarx"; macOS
      # "Application Support"). Re-run from a spaced root so a quoting regression fails CI.
      - name: Run suite from a path containing spaces
        shell: bash
        run: |
          dest="$RUNNER_TEMP/cx space dir"
          rm -rf "$dest"; mkdir -p "$dest"
          cp -R "$GITHUB_WORKSPACE/." "$dest/"
          bash "$dest/tests/run-tests.sh"

  version-sync:
    name: version-sync
    runs-on: cx-private-ubuntu-x64
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      # On a tag push (cx-security-v*), CX_RELEASE_TAG activates the tag==plugin.json check;
      # on branch/PR builds it is empty and that check skips while the rest still runs.
      - name: Packaging & version-sync invariants
        shell: bash
        env:
          CX_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python tests/test_packaging.py
