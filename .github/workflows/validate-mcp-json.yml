name: Validate mcp.json

on:
  push:
    branches: [main]
    paths:
      - 'mcp/mcp.json'
  pull_request:
    paths:
      - 'mcp/mcp.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: cx-public-ubuntu-x64
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate JSON syntax
        run: python3 -m json.tool mcp/mcp.json > /dev/null

      - name: Confirm placeholders are present (no real secrets committed)
        run: |
          if grep -qE '"(https?://|Bearer |[A-Za-z0-9_-]{32,})' mcp/mcp.json; then
            echo "ERROR: mcp.json appears to contain real credentials or URLs."
            echo "Ensure all values use placeholder syntax like <PLACEHOLDER>."
            exit 1
          fi
          echo "OK: mcp.json contains only placeholder values."

      - name: Confirm required placeholder keys exist
        run: |
          python3 - <<'EOF'
          import json, sys
          with open("mcp/mcp.json") as f:
              data = json.load(f)
          servers = data.get("mcpServers", {})
          if not servers:
              print("ERROR: mcpServers key is missing or empty")
              sys.exit(1)
          for name, cfg in servers.items():
              url = cfg.get("url", "")
              auth = cfg.get("headers", {}).get("Authorization", "")
              if "<" not in url or "<" not in auth:
                  print(f"ERROR: server '{name}' is missing placeholder values in url or Authorization")
                  sys.exit(1)
          print("OK: all required placeholder fields are present")
          EOF
